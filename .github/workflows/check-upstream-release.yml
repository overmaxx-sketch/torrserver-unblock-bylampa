name: Sync Upstream Release

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */1 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-release-check
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "YouROK/TorrServer"
  MIN_VERSION: "MatriX.144.1"
  PATCH_FILE: "server/web/waf/referer.go"
  BLOCKED_PATTERN: "bylampa"
  DOCKER_WORKFLOW: ".github/workflows/docker_image.yml"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Не запускаем синхронизацию во время сборок
      - name: Check dependent workflows
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          for wf in "ts_release.yml" "docker_image.yml"; do
            ACTIVE=$(
              gh run list \
                --workflow="$wf" \
                --repo "$GITHUB_REPOSITORY" \
                --limit 100 \
                --json status \
                --jq '[.[] | select(
                  .status == "in_progress" or
                  .status == "queued"
                )] | length'
            )

            if [ "$ACTIVE" -gt 0 ]; then
              echo "::notice::Workflow $wf is busy ($ACTIVE run(s))."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "skip=false" >> "$GITHUB_OUTPUT"

      # 2. Получаем репозиторий и настраиваем Git
      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "bylampa-bot"
          git config user.email "actions@github.com"

          git remote set-url origin \
            "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git remote add upstream \
            "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true

          git fetch origin master
          git checkout master
          git pull --ff-only origin master

      # Keep the repository's README fork-specific even when no upstream release is new.
      - name: Update fork README
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > README.md <<'README_EOF'
          # TorrServer Bylampa Unlock
          
          An unofficial [TorrServer](https://github.com/YouROK/TorrServer) fork with a targeted compatibility patch for Bylampa.online. This repository publishes its own builds and releases; use the downloads from this repository, not the upstream release page.
          
          > This project is not affiliated with or endorsed by the TorrServer upstream maintainers or Bylampa.online. The patch changes TorrServer's WAF `Referer` handling and cannot guarantee that third-party services remain available or compatible.
          
          ## What this fork changes
          
          - **Bylampa compatibility patch:** removes the Bylampa-related WAF referer restriction from `server/web/waf/referer.go` during release preparation.
          - **Automated upstream sync:** tracks stable upstream `MatriX.*` releases starting at `MatriX.144.1`.
          - **Separate release tags:** each fork release uses the upstream version plus the `-bylampa` suffix, for example `MatriX.144.1-bylampa`.
          - **Fork-specific builds:** release assets are built and published through this repository's GitHub Actions workflows.
          
          The rest of the code is based on the upstream TorrServer project. This fork does not represent a separate TorrServer implementation.
          
          ## Download
          
          Open the [Releases page](https://github.com/overmaxx-sketch/torrserver-unblock-bylampa/releases) and select a release with a tag ending in `-bylampa`. Download the asset that matches your operating system and CPU architecture. The files attached to a specific release are the source of truth for what is available in that version.
          
          Do not use assets from the upstream TorrServer Releases page if you specifically need the Bylampa patch.
          
          ## Quick start
          
          ### Windows
          
          1. Download the matching `TorrServer-windows-*.exe` asset from this repository's Releases page.
          2. Run the downloaded executable.
          3. On the same device, open [http://127.0.0.1:8090](http://127.0.0.1:8090) to access the web interface.
          
          ### Linux
          
          Download the binary matching your CPU architecture. For example, for Linux on amd64:
          
          ```bash
          chmod +x ./TorrServer-linux-amd64
          ./TorrServer-linux-amd64
          ```
          
          Replace the filename with the exact asset you downloaded. If your distribution or architecture provides an AppImage release asset, you can use that instead.
          
          ### macOS
          
          Download the `TorrServer-darwin-amd64` build for Intel Macs or `TorrServer-darwin-arm64` for Apple Silicon, then run the binary from Terminal. You may need to grant execute permission first:
          
          ```bash
          chmod +x ./TorrServer-darwin-arm64
          ./TorrServer-darwin-arm64
          ```
          
          Use the filename matching the downloaded asset. By default, the web interface is available at [http://127.0.0.1:8090](http://127.0.0.1:8090) on the device running TorrServer.
          
          ### Docker
          
          This repository's Docker workflow builds images for `linux/amd64`, `linux/arm64`, and `linux/arm/v7` and publishes release-tagged images to GitHub Container Registry when the workflow succeeds.
          
          1. Choose a real `-bylampa` tag from the [Releases page](https://github.com/overmaxx-sketch/torrserver-unblock-bylampa/releases).
          2. Set `TAG` below to that exact tag, then run the commands:
          
          ```bash
          # Replace this example with an existing tag from the Releases page.
          TAG="MatriX.144.1-bylampa"
          mkdir -p "$HOME/torrserver-data"
          docker pull "ghcr.io/overmaxx-sketch/torrserver-unblock-bylampa:${TAG}"
          docker run -d \
            --name torrserver \
            --restart unless-stopped \
            -p 8090:8090 \
            -v "$HOME/torrserver-data:/opt/ts" \
            "ghcr.io/overmaxx-sketch/torrserver-unblock-bylampa:${TAG}"
          ```
          
          The example tag is illustrative; use a tag that actually appears on the Releases page and confirm that its container image has been published. Open [http://127.0.0.1:8090](http://127.0.0.1:8090) after the container starts. Keep the data volume when replacing the container so your persistent data is preserved.
          
          Do not expose TorrServer directly to the public internet without appropriate authentication and network protection.
          
          ## Release assets and platforms
          
          The workflows define builds for these targets. The exact files attached to each release may vary by version:
          
          - **Windows:** amd64 and 386; a GStreamer-enabled amd64 build.
          - **Linux:** amd64, arm64, ARMv7, ARMv5, 386, MIPS, MIPSel, MIPS64, MIPS64el, and RISC-V 64; AppImage builds are also produced for amd64, arm64, and ARMv7. GStreamer-enabled builds are produced for amd64 and arm64.
          - **macOS:** Intel amd64 and Apple Silicon arm64; GStreamer-enabled builds for both architectures.
          - **FreeBSD:** amd64 and ARMv7.
          - **Android:** ARMv7, arm64, 386, and amd64 binaries for compatible environments.
          - **iOS:** an XCFramework intended for embedding in a host application; it is not a standalone iOS app.
          - **Docker:** `linux/amd64`, `linux/arm64`, and `linux/arm/v7`.
          
          Some GStreamer-enabled builds have additional runtime requirements. Read the notes attached to the particular release before choosing one.
          
          ## Versioning and updates
          
          Fork releases are based on upstream stable `MatriX.*` releases starting from `MatriX.144.1`. The fork's release tag adds `-bylampa`, for example `MatriX.144.1-bylampa`. The synchronization workflow applies the patch and publishes a separate Git tag and GitHub Release in this repository.
          
          To update a direct installation, download and run the desired newer asset from this repository. For Docker, pull the new image tag and recreate the container while reusing the same data volume.
          
          ## Troubleshooting
          
          - **The web interface does not open:** confirm the process or container is running and that port `8090` is available; open the address on the same device where TorrServer is running.
          - **The binary will not start on Linux or macOS:** check that you selected the correct architecture and that the file has execute permission.
          - **A release does not contain the asset you expect:** check the assets and release notes for that exact tag; not every target is necessarily published in every release.
          - **Bylampa still does not work:** this patch only changes the matching TorrServer WAF referer restriction. It does not control Bylampa.online, network access, or other third-party requirements.
          
          ## Source and license
          
          This fork is based on [YouROK/TorrServer](https://github.com/YouROK/TorrServer). See this repository's [LICENSE](https://github.com/overmaxx-sketch/torrserver-unblock-bylampa/blob/master/LICENSE) for licensing terms.
          README_EOF

          git add README.md
          if git diff --cached --quiet; then
            echo "README.md is already up to date."
          else
            git commit -m "docs: keep README specific to Bylampa fork"
            git push origin HEAD:refs/heads/master
          fi

      # 3. Ищем все пропущенные стабильные релизы
      - name: Find missing upstream releases
        if: steps.guard.outputs.skip != 'true'
        id: missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          ALL_TAGS=$(
            gh api --paginate \
              "repos/${UPSTREAM_REPO}/releases?per_page=100" \
              --jq '.[] | select(.prerelease == false) | .tag_name'
          )

          FILTERED_TAGS=$(
            printf '%s\n' "$ALL_TAGS" |
              grep -E '^MatriX\.' |
              sort -Vu || true
          )

          MISSING=""
          LATEST=""

          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue

            # Оставляем только версии начиная с MIN_VERSION
            OLDEST=$(
              printf '%s\n%s\n' "$MIN_VERSION" "$TAG" |
                sort -V |
                head -n 1
            )

            if [ "$OLDEST" != "$MIN_VERSION" ]; then
              echo "Skipping older version: $TAG"
              continue
            fi

            LATEST="$TAG"
          done <<< "$FILTERED_TAGS"

          if [ -z "$LATEST" ]; then
            echo "::error::No upstream releases found >= $MIN_VERSION"
            exit 1
          fi

          EXISTING_TAGS=$(
            git ls-remote --tags origin |
              awk '{print $2}'
          )

          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue

            OLDEST=$(
              printf '%s\n%s\n' "$MIN_VERSION" "$TAG" |
                sort -V |
                head -n 1
            )

            [ "$OLDEST" = "$MIN_VERSION" ] || continue

            TARGET="${TAG}-bylampa"

            if printf '%s\n' "$EXISTING_TAGS" |
                grep -qFx "refs/tags/${TARGET}"; then

              if gh release view "$TARGET" \
                  --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "Already published: $TARGET"
                continue
              fi

              echo "Tag exists; release needs to be created: $TARGET"
            else
              echo "Missing tag: $TARGET"
            fi

            MISSING="${MISSING}${TAG}"$'\n'
          done <<< "$FILTERED_TAGS"

          {
            echo "tags<<EOF"
            printf '%s' "$MISSING"
            echo "EOF"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$MISSING" ]; then
            echo "All eligible releases already have tags and releases."
          else
            echo "Missing upstream versions:"
            printf '%s' "$MISSING"
          fi

      # 4. Создаём отдельные релизы Bylampa
      - name: Build and publish missing releases
        if: >-
          steps.guard.outputs.skip != 'true' &&
          steps.missing.outputs.tags != ''
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAGS: ${{ steps.missing.outputs.tags }}
          LATEST_UPSTREAM_TAG: ${{ steps.missing.outputs.latest }}
        run: |
          set -euo pipefail

          # Сохраняем README и собственные workflow форка:
          # upstream не должен затереть документацию и автоматизацию форка.
          cp README.md "$RUNNER_TEMP/bylampa-readme.md"
          mkdir -p "$RUNNER_TEMP/bylampa-workflows"

          if [ -d .github/workflows ]; then
            cp -a .github/workflows/. \
              "$RUNNER_TEMP/bylampa-workflows/"
          fi

          git fetch upstream --tags

          LATEST_CREATED=false

          # Список отсортирован по версии от старой к новой.
          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue

            TARGET="${TAG}-bylampa"

            echo "::group::Processing $TARGET"

            # Если тег уже опубликован, но Release отсутствует,
            # создаём только Release, не перезаписывая тег.
            if git ls-remote --exit-code --tags origin \
                "refs/tags/${TARGET}" >/dev/null 2>&1; then

              if ! gh release view "$TARGET" \
                  --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

                {
                  echo "Fork of ${UPSTREAM_REPO}, based on ${TAG}."
                  echo
                  echo "Bylampa-specific TorrServer release."
                  echo "The WAF referer restriction for Bylampa was patched."
                } > release_notes.md

                gh release create "$TARGET" \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "${TARGET} — Bylampa unblocked" \
                  --notes-file release_notes.md \
                  --verify-tag

                echo "Release recreated: $TARGET"
              else
                echo "Already published: $TARGET"
              fi

              echo "::endgroup::"
              continue
            fi

            # Начинаем с исходников конкретного upstream-тега.
            git fetch upstream "$TAG"
            UPSTREAM_COMMIT="$(git rev-parse FETCH_HEAD)"

            # Удаляем файлы предыдущей версии, которых больше
            # нет в upstream, не затрагивая workflow форка.
            git ls-tree -r --name-only "$UPSTREAM_COMMIT" |
              sort -u > "$RUNNER_TEMP/upstream-files.txt"

            git ls-files |
              grep -v '^\.github/workflows/' |
              sort -u > "$RUNNER_TEMP/current-files.txt" || true

            comm -23 \
              "$RUNNER_TEMP/current-files.txt" \
              "$RUNNER_TEMP/upstream-files.txt" |
              while IFS= read -r FILE; do
                [ -n "$FILE" ] || continue
                git rm -f -- "$FILE"
              done

            # Обновляем дерево файлами нужной версии upstream.
            git checkout "$UPSTREAM_COMMIT" -- .

            # Восстанавливаем workflow форка.
            mkdir -p .github/workflows
            cp -a "$RUNNER_TEMP/bylampa-workflows/." \
              .github/workflows/

            # Восстанавливаем README форка после checkout файлов upstream.
            cp "$RUNNER_TEMP/bylampa-readme.md" README.md
            # Отключаем триггер Docker workflow по push в master.
            # Изменяются только строки, соответствующие этим шаблонам.
            if [ -f "$DOCKER_WORKFLOW" ]; then
              sed -i '/branches:.*master/d' "$DOCKER_WORKFLOW"
              sed -i '/^[[:space:]]*- master[[:space:]]*$/d' \
                "$DOCKER_WORKFLOW"
            fi

            # Применяем патч WAF.
            if [ ! -f "$PATCH_FILE" ]; then
              echo "::error::Missing WAF file: $PATCH_FILE"
              exit 1
            fi

            if ! grep -qi "$BLOCKED_PATTERN" "$PATCH_FILE"; then
              echo "::error::Expected WAF pattern not found: $BLOCKED_PATTERN"
              exit 1
            fi

            sed -i "/${BLOCKED_PATTERN}/Id" "$PATCH_FILE"

            if grep -qi "$BLOCKED_PATTERN" "$PATCH_FILE"; then
              echo "::error::WAF patch verification failed for $TAG"
              exit 1
            fi

            echo "WAF patch verified."

            # Проверяем синтаксис всех workflow перед коммитом.
            git add -A

            # Удаляем пробелы и табы в конце строк только в добавленных,
            # скопированных и изменённых файлах, исключая удалённые.
            git diff --cached --name-only --diff-filter=ACM -z |
              xargs -0 -r sed -i 's/[[:blank:]]*$//'
            
            git add -A
            git diff --cached --check
            
            git commit \
              -m "Release ${TARGET} (upstream ${TAG} + Bylampa patch)"

            # Создаём уникальный тег. Существующий удалённый тег
            # никогда не удаляем автоматически.
            git tag -d "$TARGET" 2>/dev/null || true
            git tag "$TARGET"

            git push origin "refs/tags/${TARGET}"

            echo "Tag pushed: $TARGET"

            # Создаём Release только после успешной публикации тега.
            {
              echo "Fork of ${UPSTREAM_REPO}, based on ${TAG}."
              echo
              echo "Removed the Bylampa-related WAF referer restriction."
              echo "This release contains the Bylampa-specific patch."
            } > release_notes.md

            gh release create "$TARGET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "${TARGET} — Bylampa unblocked" \
              --notes-file release_notes.md \
              --verify-tag

            echo "Release created: $TARGET"

            if [ "$TAG" = "$LATEST_UPSTREAM_TAG" ]; then
              LATEST_CREATED=true
            fi

            echo "::endgroup::"
          done <<< "$TAGS"

          # Обновляем master только если в этом запуске создан
          # тег последней подходящей upstream-версии.
          # Так старые пропущенные версии не откатят master назад.
          if [ "$LATEST_CREATED" = true ]; then
            git push origin HEAD:refs/heads/master
            echo "master updated to the latest processed release."
          else
            echo "master was not changed: latest upstream tag was not created."
          fi
